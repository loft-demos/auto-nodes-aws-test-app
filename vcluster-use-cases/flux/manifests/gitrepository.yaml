apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: auto-nodes-aws-test-app
  namespace: p-auth-core
spec:
  interval: 5m0s
  url: 'https://github.com/loft-demos/auto-nodes-aws-test-app.git'
  ref:
    branch: 'auto-nodes-aws'
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: github-dispatch
  namespace: p-auth-core
spec:
  type: githubdispatch
  address: 'https://github.com/loft-demos/auto-nodes-aws-test-app'
  secretRef:
    name: loft-demo-org-cred
---
